<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="../images/favicon.png">
    <title>Rush Racer Terms of Service</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            text-align: center;
            color: #212323;
        }
        header {
            background-color: #212323;
            color: #f5bf00; /* Yellow for text */
            padding: 20px;
        }
        header img {
            max-width: 150px;
            height: auto;
            margin: 10px auto;
            display: block;
        }
        header h1 {
            margin: 0;
            font-size: 2.5rem;
        }
        .modal-content {
            background-color: #fefefe;
            margin: 15% auto;
            padding: 20px;
            border: 1px solid #888;
            width: 80%;
            max-width: 600px;
            overflow: auto;
            height: 80%;
        }
        .modal-content pre {
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        /* Removed close button styles */
    </style>
</head>
<body>
    <header>
        <img src="../images/bork_logo.png" alt="Bork Creative Studio Logo">
        <h1>Rush Racer Terms of Service</h1>
    </header>
    <div class="modal-content">
        <!-- Removed close button element -->
        <div id="terms-of-service-content"></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        // Get the content div for the terms of service
        var contentDiv = document.getElementById("terms-of-service-content");

        // Function to fetch and render the markdown content
        function fetchAndRenderMarkdown() {
            fetch('RushRacerTermsOfService.md')
                .then(response => {
                    console.log('Response:', response);
                    if (!response.ok) {
                        throw new Error('Network response was not ok ' + response.statusText);
                    }
                    return response.text();
                })
                .then(text => {
                    console.log('Markdown text:', text);
                    contentDiv.innerHTML = marked.parse(text);
                })
                .catch(error => {
                    console.error('Error fetching terms of service:', error);
                    contentDiv.innerHTML = '<p>Error loading terms of service.</p>';
                });
        }

        // Fetch and render the markdown content on page load
        window.onload = function() {
            fetchAndRenderMarkdown();
        }

        // Add event listener to close the modal when clicking its close button
        // Removed close button functionality

        // Add event listener to close the modal when clicking outside of it
        // Removed close button functionality
    </script>
</body>
</html>
