<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="images/favicon.png">
    <title>Börk Creative Studio</title>
    
    <!-- Cloudflare Web Analytics -->
    <script defer src='https://static.cloudflareinsights.com/beacon.min.js' 
        data-cf-beacon='{"token": "yjY8ECpI-cAWAEWohRPMIgifXIcEPnuke4JJxjWL"}'>
    </script>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            text-align: center;
            color: #212323;
        }
        header {
            background-color: #212323;
            color: #f5bf00; /* Yellow for text */
            padding: 20px;
        }
        header img {
            max-width: 150px;
            height: auto;
            margin: 10px auto;
            display: block;
        }
        header h1 {
            margin: 0;
            font-size: 2.5rem;
        }
        .game-section {
            margin: 40px 0;
        }
        .game-image {
            max-width: 300px;
            height: auto;
            margin: 20px auto;
            display: block;
            /* border: 5px solid #f5bf00; Yellow border around game image */
        }
        .store-links img {
            max-width: 150px;
            margin: 10px;
        }
        .store-links a {
            margin: 10px;
            text-decoration: none;
            color: #f5bf00;
            font-weight: bold;
        }
        .store-links a:hover {
            text-decoration: underline;
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 1;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.4);
        }
        .modal-content {
            background-color: #fefefe;
            margin: 15% auto;
            padding: 20px;
            border: 1px solid #888;
            width: 80%;
            max-width: 600px;
            overflow: auto;
            height: 80%;
        }
        .modal-content pre {
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
        }
        .close:hover,
        .close:focus {
            color: black;
            text-decoration: none;
            cursor: pointer;
        }
        .launcher-icon {
            max-width: 150px;
            height: auto;
            margin: 20px auto;
            border: 3px solid #f5bf00; /* Yellow border around launcher icon */
        }
        footer {
            background-color: #212323;
            color: #f5bf00; /* Yellow text */
            padding: 20px;
        }
        footer p {
            margin: 5px 0;
        }
        .developer-info a {
            color: #f5bf00; /* Yellow email link */
            text-decoration: none;
        }
        .developer-info a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <header>
        <img src="images/bork_logo.png" alt="Bork Creative Studio Logo">
        <h1>Börk Creative Studio</h1>
    </header>
    
    <section class="game-section">
        <h2>Rush Racer (Early Access)</h2>
        <img src="images/IconDummy_00002.png" alt="Game Image" class="game-image">
        
        <div class="store-links">
            <a href="https://play.google.com/store/apps/details?id=com.borkcreative.rush-racer">
                <img src="images/playstore_badge.png" alt="Google Play Store">
            </a>
            <a href="https://apps.apple.com/us/app/rush-racer">
                <img src="images/appstore_badge.png" alt="Apple App Store">
            </a>
            <a href="#" id="privacy-policy-link">Privacy Policy</a>
        </div>
        
        <!-- <img src="path-to-launcher-icon.png" alt="Game Launcher Icon" class="launcher-icon"> -->
    </section>
    
    <footer>
        <div class="developer-info">
            <p>Address: Türkali Mahallesi Maşuklar Yokuşu Sokak No: 79/5 Beşiktaş / İstanbul, Türkiye</p>
            <p>Email: <a href="mailto:hello@borkistanbul.com">hello@borkistanbul.com</a></p>
        </div>
        <p>&copy; 2024 Börk Creative Studio. All rights reserved.</p>
    </footer>

    <!-- Privacy Policy Modal -->
    <div id="privacy-modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Privacy Policy for [Your Game Name]</h2>
            <div id="privacy-policy-content"></div>
        </div>
    </div>

    <!-- Include marked library for markdown rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        // Get the modal
        var modal = document.getElementById("privacy-modal");

        // Get the button that opens the modal
        var btn = document.getElementById("privacy-policy-link");

        // Get the <span> element that closes the modal
        var span = document.getElementsByClassName("close")[0];

        // Get the content div for the privacy policy
        var contentDiv = document.getElementById("privacy-policy-content");

        // Function to fetch and render the markdown content
        function fetchAndRenderMarkdown() {
            fetch('RushRacer/RushRacerPrivacyPolicy.md')
                .then(response => {
                    console.log('Response:', response);
                    if (!response.ok) {
                        throw new Error('Network response was not ok ' + response.statusText);
                    }
                    return response.text();
                })
                .then(text => {
                    console.log('Markdown text:', text);
                    contentDiv.innerHTML = marked.parse(text);
                })
                .catch(error => {
                    console.error('Error fetching privacy policy:', error);
                    contentDiv.innerHTML = '<p>Error loading privacy policy.</p>';
                });
        }

        // When the user clicks the button, open the modal and fetch the markdown content
        btn.onclick = function() {
            modal.style.display = "block";
            fetchAndRenderMarkdown();
        }

        // When the user clicks on <span> (x), close the modal
        span.onclick = function() {
            modal.style.display = "none";
        }

        // When the user clicks anywhere outside of the modal, close it
        window.onclick = function(event) {
            if (event.target == modal) {
                modal.style.display = "none";
            }
        }
    </script>
</body>
</html>
