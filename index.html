<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="images/favicon.png">
    <title>Börk Creative Studio</title>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            text-align: center;
            color: #212323;
        }
        header {
            background-color: #212323;
            color: #f5bf00;
            box-sizing: border-box;
            min-height: 255px;
            padding: 20px;
        }
        header img {
            max-width: 150px;
            height: auto;
            margin: 10px auto;
            display: block;
        }
        header h1 {
            margin: 0;
            font-size: 2.5rem;
            line-height: 1.125;
        }
        @media (max-width: 700px) {
            header {
                min-height: 300px;
            }
        }
        @media (max-width: 360px) {
            header h1 {
                font-size: 2rem;
            }
        }
        .game-section {
            margin: 40px 0;
        }
        .game-image {
            max-width: 500px;
            height: auto;
            margin: 20px auto;
            display: block;
        }
        .store-links img {
            max-width: 150px;
            margin: 10px;
        }
        .store-links a {
            margin: 10px;
            text-decoration: none;
            color: #f5bf00;
            font-weight: bold;
        }
        .store-links a:hover {
            text-decoration: underline;
        }
        .community-link {
            margin-top: 12px;
        }
        .community-link a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .discord-icon {
            height: 40px;
            width: auto;
            max-width: none;
        }
        .modal-content {
            background-color: #fefefe;
            margin: 15% auto;
            padding: 20px;
            border: 1px solid #888;
            width: 80%;
            max-width: 600px;
            overflow: auto;
            height: 80%;
        }
        .modal-content pre {
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .launcher-icon {
            max-width: 150px;
            height: auto;
            margin: 20px auto;
            border: 3px solid #f5bf00;
        }
        footer {
            background-color: #212323;
            color: #f5bf00;
            padding: 20px;
        }
        footer p {
            margin: 5px 0;
        }
        .developer-info a {
            color: #f5bf00;
            text-decoration: none;
        }
        .developer-info a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <header>
        <img src="images/bork_logo.png" alt="Bork Creative Studio Logo">
        <h1>Börk Creative Studio</h1>
    </header>
    
    <section class="game-section">
        <h2>Rush Racer</h2>
        <div class="game-image">
            <iframe
                src="https://www.youtube-nocookie.com/embed/NF3rUBptgVs"
                title="Rush Racer video"
                loading="lazy"
                referrerpolicy="strict-origin-when-cross-origin"
                allow="accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                allowfullscreen
                style="width: 100%; aspect-ratio: 16 / 9; display: block; border: 0;"
            ></iframe>
        </div>
        
        <div class="store-links">
            <a href="https://play.google.com/store/apps/details?id=com.borkistanbul.rushracer" target="_blank" rel="noopener noreferrer">
                <img src="images/playstore_badge.png" alt="Google Play Store">
            </a>
            <a href="https://apps.apple.com/us/app/rush-racer/id6743004671" target="_blank" rel="noopener noreferrer">
                <img src="images/appstore_badge.png" alt="Apple App Store">
            </a>
            <br>
            <a href="RushRacer/RushRacerPrivacyPolicy.html" id="privacy-policy-link">Privacy Policy</a> | 
            <a href="RushRacer/RushRacerTermsOfService.html" id="terms-of-service-link">Terms of Service</a> |
            <a href="RushRacer/RushRacerDataDeletion.html" id="data-deletion-link">Data Deletion</a>
            <div class="community-link">
                <a href="https://discord.gg/WKBj7qcTGe" target="_blank" rel="noopener noreferrer">
                    <img src="images/discord_icon.svg" alt="Discord" class="discord-icon">
                    Join the community in Discord
                </a>
            </div>
        </div>
    </section>
    
    <footer>
        <div class="developer-info">
            <p>Address: İstanbul, Türkiye</p>
            <p>Email: <a href="mailto:hello@borkistanbul.com">hello@borkistanbul.com</a></p>
        </div>
        <p>&copy; 2024-2026 Börk Creative Studio. All rights reserved.</p>
    </footer>

    <script defer src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "de4eba2b17fa4919a2c4ee88b6195da9"}'></script>
</body>
</html>
